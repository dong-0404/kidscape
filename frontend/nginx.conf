server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the backend's JSON body limit (raise per-location when uploads are added).
    client_max_body_size 1m;

    # Security headers for the SPA (helmet only covers /api on the backend).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip text assets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Proxy API calls to the backend service on the shared Docker network.
    # Use Docker's embedded DNS (127.0.0.11) + a variable so nginx resolves the
    # upstream at request time — it won't fail to start if the backend is briefly down.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "http://backend:5000";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback (client-side routes like /admin, /admin/login).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
